version: "3.9"

services:
  # ── Qdrant Vector Database ──────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: audit_qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── FastAPI Audit Tool ──────────────────────────────────────────────────────
  audit-tool:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audit_tool
    ports:
      - "8000:8000"
    env_file:
      - audit-tool/.env
    environment:
      - QDRANT_HOST=qdrant   # Override localhost → container name
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_data:
